<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 1.5rem;
      color: #1a202c;
      font-size: 1.5rem;
      text-align: center;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      margin-bottom: 0.4rem;
      color: #4a5568;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .date-label-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lock-status {
      font-size: 0.75rem;
      color: #e53e3e;
      font-weight: normal;
    }
    .lock-status.unlocked {
      color: #2f855a;
    }
    .relock-btn {
      background: none;
      border: none;
      color: #3182ce;
      font-size: 0.75rem;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      margin-left: 5px;
    }
    input, select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 1rem;
      color: #2d3748;
      background-color: #f8fafc;
      transition: all 0.2s ease-in-out;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #3182ce;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
    }
    button {
      width: 100%;
      padding: 0.85rem;
      background-color: #3182ce;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease-in-out;
      margin-top: 0.5rem;
    }
    button:hover {
      background-color: #2b6cb0;
    }
    button:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
    }
    #status {
      margin-top: 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      min-height: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Expense Tracker</h2>
    <form id="expenseForm">
      <div class="form-group">
        <div class="date-label-wrapper">
          <label for="expenseDate">Expense Date</label>
          <span id="lockStatus" class="lock-status">🔒 Locked</span>
        </div>
        <input type="date" id="expenseDate" required>
      </div>

      <div class="form-group">
        <label for="itemName">Item Name</label>
        <input type="text" id="itemName" required placeholder="e.g. Chocolate Bar">
      </div>

      <div class="form-group">
        <label for="price">Price (฿)</label>
        <input type="number" step="0.01" min="0" id="price" required placeholder="0.00">
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="">-- Select Category --</option>
          <option value="Food">Food</option>
          <option value="Supplies">Supplies</option>
          <option value="Electricity">Electricity</option>
          <option value="Water">Water</option>
          <option value="Gas">Gas</option>
          <option value="Ice cream">Ice cream</option>
          <option value="Dessert">Dessert</option>
          <option value="Packaging">Packaging</option>
        </select>
      </div>

      <button type="submit" id="submitBtn">Save Expense</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXvyaesLjxLyCvzGliNuqcPILjItIEIwjEa2DYmGbr9Sbo3N_AF_NHWu_SQVZzvTms/exec";
    
    // Security Config: PIN and unlock window (30 minutes)
    const REQUIRED_PIN = "3232";
    const UNLOCK_DURATION_MS = 30 * 60 * 1000;

    const dateInput = document.getElementById('expenseDate');
    const lockStatusEl = document.getElementById('lockStatus');
    const today = new Date().toISOString().split('T')[0];
    
    dateInput.value = today;
    let lastValidDate = today;

    function isUnlocked() {
      const unlockTime = localStorage.getItem('date_unlock_timestamp');
      if (!unlockTime) return false;
      const elapsed = new Date().getTime() - parseInt(unlockTime, 10);
      if (elapsed < UNLOCK_DURATION_MS) {
        return true;
      } else {
        localStorage.removeItem('date_unlock_timestamp');
        return false;
      }
    }

    function updateLockUI() {
      if (isUnlocked()) {
        lockStatusEl.className = "lock-status unlocked";
        lockStatusEl.innerHTML = '🔓 Unlocked (30m) <button type="button" class="relock-btn" onclick="relockDate()">Lock Now</button>';
      } else {
        lockStatusEl.className = "lock-status";
        lockStatusEl.innerHTML = "🔒 Locked";
      }
    }

    window.relockDate = function() {
      localStorage.removeItem('date_unlock_timestamp');
      updateLockUI();
    };

    dateInput.addEventListener('change', function() {
      if (this.value === lastValidDate) return;

      if (isUnlocked()) {
        lastValidDate = this.value;
      } else {
        const userPin = prompt("Enter PIN to unlock date changes for 30 minutes:");
        if (userPin === REQUIRED_PIN) {
          localStorage.setItem('date_unlock_timestamp', new Date().getTime().toString());
          lastValidDate = this.value;
          updateLockUI();
          alert("Date unlocked for 30 minutes!");
