<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 1.5rem;
      color: #1a202c;
      font-size: 1.5rem;
      text-align: center;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      margin-bottom: 0.4rem;
      color: #4a5568;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .date-label-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lock-status {
      font-size: 0.75rem;
      color: #e53e3e;
      font-weight: normal;
    }
    .lock-status.unlocked {
      color: #2f855a;
    }
    .relock-btn {
      background: none;
      border: none;
      color: #3182ce;
      font-size: 0.75rem;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      margin-left: 5px;
    }
    input, select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 1rem;
      color: #2d3748;
      background-color: #f8fafc;
      transition: all 0.2s ease-in-out;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #3182ce;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
    }
    button[type="submit"] {
      width: 100%;
      padding: 0.85rem;
      background-color: #2b6cb0;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease-in-out;
      margin-top: 0.5rem;
    }
    button[type="submit"]:hover {
      background-color: #2c5282;
    }
    button:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
    }
    #status {
      margin-top: 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      min-height: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Add Expense</h2>
    <form id="expenseForm">
      <div class="form-group">
        <div class="date-label-wrapper">
          <label for="expenseDate">Expense Date</label>
          <span id="lockStatus" class="lock-status">🔒 Locked</span>
        </div>
        <input type="date" id="expenseDate" required>
      </div>

      <div class="form-group">
        <label for="itemName">Item Name</label>
        <input type="text" id="itemName" required placeholder="e.g. Chocolate Bar">
      </div>

      <div class="form-group">
        <label for="price">Price (฿)</label>
        <input type="number" step="0.01" min="0" id="price" required placeholder="0.00">
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="">-- Select Category --</option>
          <option value="Food">Food</option>
          <option value="Supplies">Supplies</option>
          <option value="Electricity">Electricity</option>
          <option value="Water">Water</option>
          <option value="Gas">Gas</option>
          <option value="Ice cream">Ice cream</option>
          <option value="Dessert">Dessert</option>
          <option value="Packaging">Packaging</option>
        </select>
      </div>

      <button type="submit" id="submitBtn">Submit Expense</button>
    </form>
    <div id="status"></div>

    <!-- Recent Expenses Section -->
    <div id="recentSection" style="display: none; margin-top: 1.5rem; border-top: 1px solid #e2e8f0; padding-top: 1rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
        <h3 style="margin: 0; font-size: 1.1rem; color: #2d3748;">Added Expenses</h3>
        <button type="button" id="clearListBtn" style="background: #e53e3e; color: white; border: none; padding: 0.35rem 0.65rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; cursor: pointer;">Clear List</button>
      </div>
      <div style="max-height: 200px; overflow-y: auto;">
        <table style="width: 100%; border-collapse: collapse; font-size: 0.875rem;">
          <thead>
            <tr style="text-align: left; border-bottom: 2px solid #edf2f7; color: #718096;">
              <th style="padding: 0.4rem;">Date</th>
              <th style="padding: 0.4rem;">Item</th>
              <th style="padding: 0.4rem;">Cat.</th>
              <th style="padding: 0.4rem; text-align: right;">Price</th>
            </tr>
          </thead>
          <tbody id="expenseListBody"></tbody>
        </table>
      </div>
      <div style="display: flex; justify-content: space-between; font-weight: 700; margin-top: 0.75rem; padding-top: 0.5rem; border-top: 1px solid #edf2f7; color: #2d3748; font-size: 0.95rem;">
        <span>Total:</span>
        <span id="totalAmount">฿0.00</span>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1K2OQ2aQbNP_8VQKgHkbx1sq0lQOg7x3ENS5aiq6s4VKlbVldkABLQ41Rzxh-vV31/exec";
    
    // Config: PIN and unlock duration (30 minutes in milliseconds)
    const REQUIRED_PIN = "3232";
    const UNLOCK_DURATION_MS = 30 * 60 * 1000; // 30 minutes

    const dateInput = document.getElementById('expenseDate');
    const lockStatusEl = document.getElementById('lockStatus');
    const today = new Date().toISOString().split('T')[0];
    
    dateInput.value = today;
    let lastValidDate = today;

    // Helper: Check if unlocked window is still active
    function isUnlocked() {
      const unlockTime = localStorage.getItem('date_unlock_timestamp');
      if (!unlockTime) return false;
      
      const now = new Date().getTime();
      const elapsed = now - parseInt(unlockTime, 10);
      
      if (elapsed < UNLOCK_DURATION_MS) {
        return true;
      } else {
        localStorage.removeItem('date_unlock_timestamp'); // Expired
        return false;
      }
    }

    // Helper: Update status display indicator
    function updateLockUI() {
      if (isUnlocked()) {
        lockStatusEl.className = "lock-status unlocked";
        lockStatusEl.innerHTML = '🔓 Unlocked (30m) <button type="button" class="relock-btn" onclick="relockDate()">Lock Now</button>';
      } else {
        lockStatusEl.className = "lock-status";
        lockStatusEl.innerHTML = "🔒 Locked";
      }
    }

    // Manual re-lock function
    window.relockDate = function() {
      localStorage.removeItem('date_unlock_timestamp');
      updateLockUI();
    };

    // Monitor date field changes
    dateInput.addEventListener('change', function() {
      if (this.value === lastValidDate) return;

      if (isUnlocked()) {
        lastValidDate = this.value;
      } else {
        const userPin = prompt("Enter PIN to unlock date changes for 30 minutes:");
        
        if (userPin === REQUIRED_PIN) {
          localStorage.setItem('date_unlock_timestamp', new Date().getTime().toString());
          lastValidDate = this.value;
          updateLockUI();
          alert("Date unlocked for 30 minutes!");
        } else {
          alert("Incorrect PIN! Resetting date.");
          this.value = lastValidDate;
        }
      }
    });

    // Check lock status on page load
    updateLockUI();

    // --- Local Expense History & Display Logic ---
    const recentSection = document.getElementById('recentSection');
    const expenseListBody = document.getElementById('expenseListBody');
    const totalAmountEl = document.getElementById('totalAmount');
    const clearListBtn = document.getElementById('clearListBtn');

    function getStoredExpenses() {
      return JSON.parse(localStorage.getItem('tracked_expenses') || '[]');
    }

    function saveAndRenderExpenses(expenses) {
      localStorage.setItem('tracked_expenses', JSON.stringify(expenses));
      renderExpenseList();
    }

    function renderExpenseList() {
      const expenses = getStoredExpenses();
      
      if (expenses.length === 0) {
        recentSection.style.display = 'none';
        return;
      }

      recentSection.style.display = 'block';
      expenseListBody.innerHTML = '';
      let total = 0;

      expenses.forEach(item => {
        total += item.price;
        const row = document.createElement('tr');
        row.style.borderBottom = '1px solid #f7fafc';
        row.innerHTML = `
          <td style="padding: 0.4rem; color: #718096; white-space: nowrap;">${item.expenseDate}</td>
          <td style="padding: 0.4rem; color: #2d3748;">${item.itemName}</td>
          <td style="padding: 0.4rem; color: #718096;">${item.category}</td>
          <td style="padding: 0.4rem; text-align: right; font-weight: 600; color: #2d3748;">฿${item.price.toFixed(2)}</td>
        `;
        expenseListBody.appendChild(row);
      });

      totalAmountEl.textContent = `฿${total.toFixed(2)}`;
    }

    clearListBtn.addEventListener('click', function() {
      if (confirm("Are you sure you want to clear the local list display? (This does not delete data already submitted to Google Sheets)")) {
        localStorage.removeItem('tracked_expenses');
        renderExpenseList();
      }
    });

    // Render local list on page load
    renderExpenseList();

    // Form submission
    document.getElementById('expenseForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusDiv = document.getElementById('status');
      
      submitBtn.disabled = true;
      statusDiv.textContent = "Sending...";
      statusDiv.style.color = "#4a5568";

      const payload = {
        itemName: document.getElementById('itemName').value,
        price: parseFloat(document.getElementById('price').value),
        category: document.getElementById('category').value,
        expenseDate: document.getElementById('expenseDate').value
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.textContent = "Expense added successfully!";
        statusDiv.style.color = "#2f855a";
        
        // Save entry locally and refresh table
        const currentExpenses = getStoredExpenses();
        currentExpenses.push(payload);
        saveAndRenderExpenses(currentExpenses);

        // Reset form fields except date
        document.getElementById('itemName').value = '';
        document.getElementById('price').value = '';
        document.getElementById('category').value = '';
        
        updateLockUI();
        submitBtn.disabled = false;
      })
      .catch(error => {
        statusDiv.textContent = "Error adding expense.";
        statusDiv.style.color = "#c53030";
        console.error("Submission Error:", error);
        submitBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
