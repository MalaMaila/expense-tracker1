<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Record Expense</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --primary: #d9534f;
      --primary-hover: #c9302c;
      --text: #333333;
      --border: #cccccc;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1.5rem;
      text-align: center;
      color: #222;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .status {
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
      color: #2e7d32;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Record Expense</h2>
    
    <!-- Form targets the hidden iframe so the page doesn't navigate away -->
    <form id="expenseForm" action="https://script.google.com/macros/s/AKfycbxtz2_GGgsUmAAqkWD9aePKKoAGAe1torNwGUXQRlkU_XTHQVslA2Fxh_NhKBHtYJ2E/exec" method="POST" target="hidden_iframe">
      <div class="form-group">
        <label for="item">Item Description</label>
        <input 
          type="text" 
          id="item" 
          name="item" 
          placeholder="e.g. chicken meat" 
          required 
          autocomplete="off"
        />
      </div>

      <div class="form-group">
        <label for="price">Price</label>
        <input 
          type="number" 
          id="price" 
          name="price" 
          step="0.01" 
          placeholder="0.00" 
          required 
        />
      </div>

      <button type="submit" id="submitBtn">Finalize</button>
    </form>

    <div id="statusMessage" class="status"></div>
  </div>

  <!-- Hidden iframe to capture the form submission response silently -->
  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="submitted()"></iframe>

  <script>
    let isSubmitted = false;

    document.getElementById('expenseForm').addEventListener('submit', function() {
      isSubmitted = true;
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('submitBtn').textContent = 'Submitting...';
    });

    function submitted() {
      if (isSubmitted) {
        document.getElementById('statusMessage.textContent = 'Expense recorded successfully!';
        document.getElementById('expenseForm').reset();
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('submitBtn').textContent = 'Finalize';
        isSubmitted = false;
      }
    }
  </script>

</body>
</html>
