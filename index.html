<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 1.5rem;
      color: #1a202c;
      font-size: 1.5rem;
      text-align: center;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      margin-bottom: 0.4rem;
      color: #4a5568;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .date-label-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lock-status {
      font-size: 0.75rem;
      color: #e53e3e;
      font-weight: normal;
    }
    .lock-status.unlocked {
      color: #2f855a;
    }
    .relock-btn {
      background: none;
      border: none;
      color: #3182ce;
      font-size: 0.75rem;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      margin-left: 5px;
    }
    input, select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 1rem;
      color: #2d3748;
      background-color: #f8fafc;
      transition: all 0.2s ease-in-out;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #3182ce;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
    }
    button[type="submit"] {
      width: 100%;
      padding: 0.85rem;
      background-color: #2b6cb0;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease-in-out;
      margin-top: 0.5rem;
    }
    button[type="submit"]:hover {
      background-color: #2c5282;
    }
    button:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
    }
    #status {
      margin-top: 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      min-height: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Add Expense</h2>
    <form id="expenseForm">
      <div class="form-group">
        <div class="date-label-wrapper">
          <label for="expenseDate">Expense Date</label>
          <span id="lockStatus" class="lock-status">🔒 Locked</span>
        </div>
        <input type="date" id="expenseDate" required>
      </div>

      <div class="form-group">
        <label for="itemName">Item Name</label>
        <input type="text" id="itemName" required placeholder="e.g. Chocolate Bar">
      </div>

      <div class="form-group">
        <label for="price">Price ($)</label>
        <input type="number" step="0.01" min="0" id="price" required placeholder="0.00">
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="">-- Select Category --</option>
          <option value="Food">Food</option>
          <option value="Supplies">Supplies</option>
          <option value="Electricity">Electricity</option>
          <option value="Water">Water</option>
          <option value="Gas">Gas</option>
          <option value="Ice cream">Ice cream</option>
        </select>
      </div>

      <button type="submit" id="submitBtn">Submit Expense</button>
    </form>
    <div id="status"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1K2OQ2aQbNP_8VQKgHkbx1sq0lQOg7x3ENS5aiq6s4VKlbVldkABLQ41Rzxh-vV31/exec";
    
    // Config: PIN and unlock duration (30 minutes in milliseconds)
    const REQUIRED_PIN = "1234";
    const UNLOCK_DURATION_MS = 30 * 60 * 1000; // 30 minutes

    const dateInput = document.getElementById('expenseDate');
    const lockStatusEl = document.getElementById('lockStatus');
    const today = new Date().toISOString().split('T')[0];
    
    dateInput.value = today;
    let lastValidDate = today;

    // Helper: Check if unlocked window is still active
    function isUnlocked() {
      const unlockTime = localStorage.getItem('date_unlock_timestamp');
      if (!unlockTime) return false;
      
      const now = new Date().getTime();
      const elapsed = now - parseInt(unlockTime, 10);
      
      if (elapsed < UNLOCK_DURATION_MS) {
        return true;
      } else {
        localStorage.removeItem('date_unlock_timestamp'); // Expired
        return false;
      }
    }

    // Helper: Update status display indicator
    function updateLockUI() {
      if (isUnlocked()) {
        lockStatusEl.className = "lock-status unlocked";
        lockStatusEl.innerHTML = '🔓 Unlocked (30m) <button type="button" class="relock-btn" onclick="relockDate()">Lock Now</button>';
      } else {
        lockStatusEl.className = "lock-status";
        lockStatusEl.innerHTML = "🔒 Locked";
      }
    }

    // Manual re-lock function
    window.relockDate = function() {
      localStorage.removeItem('date_unlock_timestamp');
      updateLockUI();
    };

    // Monitor date field changes
    dateInput.addEventListener('change', function() {
      if (this.value === lastValidDate) return;

      if (isUnlocked()) {
        // Already unlocked within 30 mins — accept change without PIN prompt
        lastValidDate = this.value;
      } else {
        // Prompt for PIN
        const userPin = prompt("Enter PIN to unlock date changes for 30 minutes:");
        
        if (userPin === REQUIRED_PIN) {
          // Store unlock timestamp
          localStorage.setItem('date_unlock_timestamp', new Date().getTime().toString());
          lastValidDate = this.value;
          updateLockUI();
          alert("Date unlocked for 30 minutes!");
        } else {
          alert("Incorrect PIN! Resetting date.");
          this.value = lastValidDate;
        }
      }
    });

    // Check status on page load
    updateLockUI();

    // Form submission
    document.getElementById('expenseForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusDiv = document.getElementById('status');
      
      submitBtn.disabled = true;
      statusDiv.textContent = "Sending...";
      statusDiv.style.color = "#4a5568";

      const payload = {
        itemName: document.getElementById('itemName').value,
        price: parseFloat(document.getElementById('price').value),
        category: document.getElementById('category').value,
        expenseDate: document.getElementById('expenseDate').value
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.textContent = "Expense added successfully!";
        statusDiv.style.color = "#2f855a";
        
        // Reset form fields except date
        document.getElementById('itemName').value = '';
        document.getElementById('price').value = '';
        document.getElementById('category').value = '';
        
        // Refresh lock UI display
        updateLockUI();
        submitBtn.disabled = false;
      })
      .catch(error => {
        statusDiv.textContent = "Error adding expense.";
        statusDiv.style.color = "#c53030";
        console.error("Submission Error:", error);
        submitBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
