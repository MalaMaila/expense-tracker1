<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #666;
    }
    input, select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background-color: #218838;
    }
    #status {
      margin-top: 1rem;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Add Expense</h2>
    <form id="expenseForm">
      <div class="form-group">
        <label for="itemName">Item Name</label>
        <input type="text" id="itemName" required placeholder="e.g. Chocolate Bar">
      </div>

      <div class="form-group">
        <label for="price">Price ($)</label>
        <input type="number" step="0.01" id="price" required placeholder="0.00">
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="">-- Select Category --</option>
          <option value="Food">Food</option>
          <option value="Supplies">Supplies</option>
          <option value="Electricity">Electricity</option>
          <option value="Water">Water</option>
          <option value="Gas">Gas</option>
          <option value="Ice cream">Ice cream</option>
        </select>
      </div>

      <button type="submit" id="submitBtn">Submit Expense</button>
    </form>
    <div id="status"></div>
  </div>

  <script>
    // REPLACE THIS URL WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1K2OQ2aQbNP_8VQKgHkbx1sq0lQOg7x3ENS5aiq6s4VKlbVldkABLQ41Rzxh-vV31/exec";

    document.getElementById('expenseForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusDiv = document.getElementById('status');
      
      submitBtn.disabled = true;
      statusDiv.textContent = "Sending...";
      statusDiv.style.color = "#333";

      const payload = {
        itemName: document.getElementById('itemName').value,
        price: parseFloat(document.getElementById('price').value),
        category: document.getElementById('category').value
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors", // Bypasses CORS restrictions for Apps Script
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.textContent = "Expense added successfully!";
        statusDiv.style.color = "green";
        document.getElementById('expenseForm').reset();
        submitBtn.disabled = false;
      })
      .catch(error => {
        statusDiv.textContent = "Error adding expense.";
        statusDiv.style.color = "red";
        console.error(error);
        submitBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
